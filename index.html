<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <div id="game-screen">
      <div id="start-screen">
        <button onclick="startGame()" id="start-game-text">Click to start</button>
        <img
          src="./img/9_intro_outro_screens/start/startscreen_1.png"
          alt="start-screen"
        />
      </div>

      <canvas id="canvas" width="720" height="480"> </canvas>

      <div onclick="restartGame()" id="game-over" class="hidden">
        <p id="restart-game-text">Click to restart</p>
        <img src="./img/You won, you lost/Game over A.png" alt="Game Over" />
      </div>
      <div onclick="restartGame()" id="you-won" class="hidden">
        <p id="restart-game-text">Click to restart</p>
        <img src="./img/You won, you lost/You won A.png" alt="You Won" />
      </div>
    </div>

    <div id="orientation-overlay" class="hidden">
      <div class="overlay-content">
        <img src="img/rotate-smartphone.png" alt="Turn-Device-Symbol" />
        <h2>Please turn your device</h2>
      </div>
    </div>

    <div id="mobile-buttons">
      <div id="mobile-buttons-left">
        <img id="left-button" src="./img/mobile_buttons/left.png" alt="Left" />
        <img
          id="right-button"
          src="./img/mobile_buttons/right.png"
          alt="Right"
        />
      </div>
      <div id="mobile-buttons-right">
        <img id="jump-button" src="./img/mobile_buttons/jump.png" alt="Jump" />
        <img
          id="throw-button"
          src="./img/mobile_buttons/throw.png"
          alt="Throw"
        />
      </div>
    </div>

    <script src="./js/models/drawable-object.class.js"></script>
    <script src="./js/models/movable-object.class.js"></script>
    <script src="./js/models/character.class.js"></script>
    <script src="./js/models/mini-chicken.class.js"></script>
    <script src="./js/models/chicken.class.js"></script>
    <script src="./js/models/endboss.class.js"></script>
    <script src="./js/models/coin.class.js"></script>
    <script src="./js/models/collectable-bottles.class.js"></script>
    <script src="./js/models/throwable-object.class.js"></script>
    <script src="./js/models/audio.class.js"></script>
    <script src="./js/models/world.class.js"></script>
    <script src="./js/models/statusbar.class.js"></script>
    <script src="./js/models/healthbar.class.js"></script>
    <script src="./js/models/coinbar.class.js"></script>
    <script src="./js/models/bottlebar.class.js"></script>
    <script src="./js/models/endboss-healthbar.class.js"></script>
    <script src="./js/models/clouds.class.js"></script>
    <script src="./js/models/background-object.class.js"></script>
    <script src="./js/models/keyboard.class.js"></script>
    <script src="./js/models/level.class.js"></script>
    <script src="./js/levels/level1.js"></script>
    <script src="./js/game.js"></script>
  </body>
</html>
